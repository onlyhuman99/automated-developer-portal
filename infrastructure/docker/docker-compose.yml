
services:
  postgres:
    image: postgres:17
    container_name: developer-portal-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: developer_portal
      POSTGRES_USER: developer
      POSTGRES_PASSWORD: devportal_local
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U developer -d developer_portal"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: developer-portal-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/developer_portal
      SPRING_DATASOURCE_USERNAME: developer
      SPRING_DATASOURCE_PASSWORD: devportal_local
      GITHUB_TOKEN: ${GITHUB_TOKEN:?Set GITHUB_TOKEN before starting}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: developer-portal-frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - backend

volumes:
  postgres_data:
